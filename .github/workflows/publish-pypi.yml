name: publish-pypi

# Publishes the EXACT distribution artifacts already validated and
# attached to an existing GitHub release — never a rebuild.
#
# Requires a PyPI Trusted Publisher configured for this workflow:
#   project: cnmv-iic · owner: Huntsman1756 · repo: OpenFunds
#   workflow: publish-pypi.yml · environment: pypi
# See docs/releases/publishing.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          GitHub release tag whose validated wheel+sdist are published
          to PyPI byte-for-byte (e.g. v0.1.0)
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cnmv-iic
    permissions:
      contents: read        # download release assets
      id-token: write       # OIDC → PyPI trusted publisher
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --clobber \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern 'SHA256SUMS.txt'

      - name: Fail closed on missing or unexpected files
        run: |
          set -euo pipefail
          cd dist
          whl=$(ls *.whl 2>/dev/null | wc -l)
          sdist=$(ls *.tar.gz 2>/dev/null | wc -l)
          [ "$whl" -eq 1 ]   || { echo "FAIL: expected exactly 1 wheel, got $whl"; exit 1; }
          [ "$sdist" -eq 1 ] || { echo "FAIL: expected exactly 1 sdist, got $sdist"; exit 1; }
          [ -f SHA256SUMS.txt ] || { echo "FAIL: SHA256SUMS.txt missing"; exit 1; }
          unexpected=$(ls | grep -v -e '\.whl$' -e '\.tar\.gz$' -e '^SHA256SUMS\.txt$' || true)
          [ -z "$unexpected" ] || { echo "FAIL: unexpected files: $unexpected"; exit 1; }

      - name: Verify byte-for-byte against published SHA256SUMS.txt
        run: |
          set -euo pipefail
          sha256sum -c dist/SHA256SUMS.txt

      - name: Verify package metadata version matches tag
        run: |
          set -euo pipefail
          expected="${{ inputs.tag }}"; expected="${expected#v}"
          python - "$expected" dist/*.whl dist/*.tar.gz <<'PY'
          import re, sys, tarfile, zipfile

          expected = sys.argv[1]

          def meta_version(body: bytes) -> str:
              m = re.search(rb"^Version: (.+)$", body, re.M)
              if not m:
                  raise SystemExit("FAIL: no Version: in package metadata")
              return m.group(1).decode().strip()

          for path in sys.argv[2:]:
              if path.endswith(".whl"):
                  with zipfile.ZipFile(path) as z:
                      name = next(n for n in z.namelist()
                                  if n.endswith(".dist-info/METADATA"))
                      v = meta_version(z.read(name))
              else:
                  with tarfile.open(path) as t:
                      name = next(n for n in t.getnames()
                                  if n.endswith("PKG-INFO"))
                      v = meta_version(t.extractfile(name).read())
              if v != expected:
                  raise SystemExit(
                      f"FAIL: {path} metadata version {v} != tag {expected}")
              print(f"OK: {path} version {v}")
          PY

      - name: Publish validated artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
